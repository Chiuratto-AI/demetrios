name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1

jobs:
    # Basic checks - fast feedback
    check:
        name: Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      compiler/target
                  key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-check-

            - name: Check formatting
              working-directory: compiler
              run: cargo fmt --all -- --check

            - name: Clippy lints
              working-directory: compiler
              run: |
                  cargo clippy --all-targets -- -D warnings \
                    -A clippy::too_many_arguments \
                    -A clippy::type_complexity \
                    -A clippy::field_reassign_with_default \
                    -A clippy::only_used_in_recursion \
                    -A clippy::not_unsafe_ptr_arg_deref \
                    -A clippy::manual_strip \
                    -A clippy::approx_constant \
                    -A clippy::should_implement_trait \
                    -A clippy::if_same_then_else \
                    -A clippy::manual_clamp \
                    -A clippy::large_enum_variant \
                    -A clippy::tabs_in_doc_comments \
                    -A clippy::vec_init_then_push \
                    -A clippy::len_zero \
                    -A clippy::single_match \
                    -A clippy::match_like_matches_macro \
                    -A clippy::needless_range_loop \
                    -A clippy::clone_on_copy \
                    -A clippy::cmp_owned \
                    -A clippy::useless_vec \
                    -A clippy::needless_return \
                    -A clippy::redundant_field_names \
                    -A clippy::unnecessary_unwrap \
                    -A clippy::collapsible_else_if \
                    -A clippy::collapsible_if \
                    -A clippy::collapsible_match \
                    -A clippy::redundant_guards \
                    -A clippy::explicit_counter_loop \
                    -A clippy::map_clone \
                    -A clippy::ptr_arg \
                    -A clippy::inherent_to_string \
                    -A clippy::inherent_to_string_shadow_display \
                    -A clippy::manual_range_contains \
                    -A clippy::let_and_return \
                    -A clippy::redundant_closure \
                    -A clippy::non_canonical_partial_ord_impl \
                    -A clippy::drop_non_drop \
                    -A clippy::box_collection \
                    -A clippy::enum_variant_names \
                    -A clippy::absurd_extreme_comparisons \
                    -A clippy::overly_complex_bool_expr \
                    -A clippy::unnecessary_get_then_check \
                    -A clippy::while_let_loop \
                    -A clippy::deref_addrof \
                    -A clippy::suspicious_arithmetic_impl \
                    -A clippy::len_without_is_empty \
                    -A clippy::result_large_err \
                    -A clippy::eq_op \
                    -A clippy::useless_format \
                    -A clippy::clone_on_ref_ptr \
                    -A clippy::vec_box \
                    -A clippy::assertions_on_constants \
                    -A clippy::cloned_ref_to_slice_refs \
                    -A clippy::nonminimal_bool \
                    -A clippy::no_effect_replace \
                    -A clippy::needless_borrow \
                    -A clippy::int_plus_one \
                    -A clippy::useless_conversion \
                    -A clippy::single_char_add_str \
                    -A clippy::manual_div_ceil \
                    -A clippy::println_empty_string \
                    -A clippy::print_literal \
                    -A clippy::derivable_impls \
                    -A clippy::unnecessary_map_or \
                    -A clippy::to_string_in_format_args \
                    -A clippy::manual_contains \
                    -A clippy::while_let_on_iterator \
                    -A unused_imports \
                    -A unused_comparisons \
                    -A dead_code \
                    -A unused_assignments \
                    -A unused_variables

    # Build and test on multiple platforms
    test:
        name: Test (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        needs: check
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]

        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      compiler/target
                  key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-test-

            - name: Build
              working-directory: compiler
              run: cargo build --release

            - name: Run Rust tests
              working-directory: compiler
              run: cargo test --release

            - name: Run stdlib tests (Unix)
              if: runner.os != 'Windows'
              working-directory: compiler
              run: |
                  echo "=== Running ALL stdlib tests ==="
                  ../scripts/run_stdlib_tests.sh

            - name: Test D programs (Unix)
              if: runner.os != 'Windows'
              working-directory: compiler
              run: |
                  echo "Testing run-pass suite..."
                  for f in ../tests/run-pass/*.d; do
                    echo "  $f"
                    ./target/release/dc run "$f"
                  done
                  echo "Testing compile-fail suite..."
                  for f in ../tests/compile-fail/*.d; do
                    echo "  $f (should fail)"
                    if ./target/release/dc check "$f" 2>/dev/null; then
                      echo "ERROR: $f should have failed but passed!"
                      exit 1
                    fi
                  done
                  echo "Testing examples..."
                  ./target/release/dc check ../examples/hello.d

            - name: Test D programs (Windows)
              if: runner.os == 'Windows'
              working-directory: compiler
              shell: pwsh
              run: |
                  echo "Testing core stdlib programs..."
                  ./target/release/dc.exe run ../stdlib/prob/beta.d
                  ./target/release/dc.exe run ../stdlib/prob/distributions.d
                  ./target/release/dc.exe run ../stdlib/epistemic/core.d
                  ./target/release/dc.exe run ../stdlib/epistemic/roi.d
                  ./target/release/dc.exe run ../stdlib/epistemic/sobol.d
                  ./target/release/dc.exe run ../stdlib/linalg/matrix.d
                  echo "Testing run-pass suite..."
                  Get-ChildItem ../tests/run-pass/*.d | ForEach-Object {
                    echo "  $_"
                    ./target/release/dc.exe run $_.FullName
                  }
                  echo "Testing examples..."
                  ./target/release/dc.exe check ../examples/hello.d

